<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 440" width="100%" height="100%">
  <defs>
    <style>
      .mono { font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
      .section-tag { font-size: 11px; fill: #888888; letter-spacing: 1.5px; }
      .meta { font-size: 10px; fill: #999999; letter-spacing: 1px; }
      .stage-title { font-size: 14px; font-weight: 700; fill: #111111; letter-spacing: 1px; }
      .stage-sub { font-size: 10.5px; fill: #666666; letter-spacing: 0.5px; }
      .stage-spec { font-size: 9.5px; fill: #888888; letter-spacing: 0.8px; }
      .feedback-tag { font-size: 9px; fill: #aaaaaa; letter-spacing: 1px; }
    </style>
  </defs>

  <!-- Canvas Surface -->
  <rect width="920" height="440" fill="#ffffff" />
  <rect x="1" y="1" width="918" height="438" fill="#fafafa" rx="6" stroke="#e5e5e5" stroke-width="1.2" />

  <!-- Section Header -->
  <g transform="translate(54, 38)">
    <text x="0" y="0" class="mono section-tag">02 // AI SYSTEM PIPELINE</text>
    <text x="812" y="0" class="mono meta" text-anchor="end">SCHEMATIC 04 · END-TO-END COMPUTATIONAL FLOW</text>
    <line x1="0" y1="12" x2="812" y2="12" stroke="#e5e5e5" stroke-width="1" />
  </g>

  <!-- Main Pipeline Bus (Vertical Trunk) -->
  <line x1="90" y1="80" x2="90" y2="390" stroke="#e5e5e5" stroke-width="1.5" />

  <!-- Schematic Tree Branch Connectors -->
  <!-- 01 DATA -->
  <path d="M 90 80 L 125 80" stroke="#cccccc" stroke-width="1.2" fill="none" />
  <circle cx="90" cy="80" r="2.5" fill="#111111" />

  <!-- 02 PREPROCESSING -->
  <path d="M 90 132 L 125 132" stroke="#cccccc" stroke-width="1.2" fill="none" />
  <circle cx="90" cy="132" r="2.5" fill="#cccccc" />

  <!-- 03 MODEL TRAINING -->
  <path d="M 90 184 L 125 184" stroke="#cccccc" stroke-width="1.2" fill="none" />
  <circle cx="90" cy="184" r="2.5" fill="#cccccc" />

  <!-- 04 EVALUATION -->
  <path d="M 90 236 L 125 236" stroke="#cccccc" stroke-width="1.2" fill="none" />
  <circle cx="90" cy="236" r="2.5" fill="#cccccc" />

  <!-- 05 INFERENCE -->
  <path d="M 90 288 L 125 288" stroke="#cccccc" stroke-width="1.2" fill="none" />
  <circle cx="90" cy="288" r="2.5" fill="#cccccc" />

  <!-- 06 API LAYER -->
  <path d="M 90 340 L 125 340" stroke="#cccccc" stroke-width="1.2" fill="none" />
  <circle cx="90" cy="340" r="2.5" fill="#cccccc" />

  <!-- 07 APPLICATION -->
  <path d="M 90 392 L 125 392" stroke="#cccccc" stroke-width="1.2" fill="none" />
  <circle cx="90" cy="392" r="2.5" fill="#111111" />

  <!-- Closed-Loop Telemetry Feedback Circuit (Right side) -->
  <path d="M 820 392 L 850 392 L 850 80 L 820 80" stroke="#e8e8e8" stroke-width="1" stroke-dasharray="3 3" fill="none" />
  <text x="844" y="240" class="mono feedback-tag" transform="rotate(90, 844, 240)" text-anchor="middle">CLOSED-LOOP FEEDBACK · MONITORING</text>

  <!-- Discrete Signal Traveling Down the Pipeline Bus -->
  <g>
    <!-- Halo ring -->
    <circle cx="90" cy="80" r="6.5" fill="none" stroke="#111111" stroke-width="1" opacity="0.25">
      <animate attributeName="cy"
               values="80; 80; 132; 132; 184; 184; 236; 236; 288; 288; 340; 340; 392; 392; 80"
               keyTimes="0; 0.10; 0.16; 0.26; 0.32; 0.42; 0.48; 0.58; 0.64; 0.74; 0.80; 0.90; 0.94; 0.98; 1"
               dur="12s" repeatCount="indefinite" calcMode="linear" />
      <animate attributeName="r" values="5.5; 8; 5.5" dur="1.8s" repeatCount="indefinite" />
    </circle>
    <!-- Core dot -->
    <circle cx="90" cy="80" r="3.5" fill="#111111">
      <animate attributeName="cy"
               values="80; 80; 132; 132; 184; 184; 236; 236; 288; 288; 340; 340; 392; 392; 80"
               keyTimes="0; 0.10; 0.16; 0.26; 0.32; 0.42; 0.48; 0.58; 0.64; 0.74; 0.80; 0.90; 0.94; 0.98; 1"
               dur="12s" repeatCount="indefinite" calcMode="linear" />
    </circle>
  </g>

  <!-- Pipeline Stages -->
  <!-- 01 DATA -->
  <g transform="translate(135, 84)">
    <text x="0" y="0" class="mono stage-title">DATA</text>
    <text x="145" y="0" class="mono stage-sub">RAW INGESTION · FEATURE STORES · ANNOTATED DATASETS</text>
    <text x="680" y="0" class="mono stage-spec" text-anchor="end">INPUT: MULTI-MODAL</text>
    <line x1="0" y1="14" x2="680" y2="14" stroke="#f0f0f0" stroke-width="1" />
  </g>

  <!-- 02 PREPROCESSING -->
  <g transform="translate(135, 136)">
    <text x="0" y="0" class="mono stage-title">PREPROCESSING</text>
    <text x="145" y="0" class="mono stage-sub">NORMALIZATION · TENSOR ENCODING · AUGMENTATION</text>
    <text x="680" y="0" class="mono stage-spec" text-anchor="end">LATENCY: &lt;5ms</text>
    <line x1="0" y1="14" x2="680" y2="14" stroke="#f0f0f0" stroke-width="1" />
  </g>

  <!-- 03 MODEL TRAINING -->
  <g transform="translate(135, 188)">
    <text x="0" y="0" class="mono stage-title">MODEL TRAINING</text>
    <text x="145" y="0" class="mono stage-sub">PYTORCH · CONVERGENCE OPTIMIZATION · WEIGHT CHECKPOINTS</text>
    <text x="680" y="0" class="mono stage-spec" text-anchor="end">GPU ACCELERATED</text>
    <line x1="0" y1="14" x2="680" y2="14" stroke="#f0f0f0" stroke-width="1" />
  </g>

  <!-- 04 EVALUATION -->
  <g transform="translate(135, 240)">
    <text x="0" y="0" class="mono stage-title">EVALUATION</text>
    <text x="145" y="0" class="mono stage-sub">ACCURACY BENCHMARKS · CONFUSION MATRICES · SAFETY GATES</text>
    <text x="680" y="0" class="mono stage-spec" text-anchor="end">VERIFIED: PASS</text>
    <line x1="0" y1="14" x2="680" y2="14" stroke="#f0f0f0" stroke-width="1" />
  </g>

  <!-- 05 INFERENCE -->
  <g transform="translate(135, 292)">
    <text x="0" y="0" class="mono stage-title">INFERENCE</text>
    <text x="145" y="0" class="mono stage-sub">QUANTIZED RUNTIME · REAL-TIME BATCHING · LOW-LATENCY ENGINE</text>
    <text x="680" y="0" class="mono stage-spec" text-anchor="end">P99: 18ms</text>
    <line x1="0" y1="14" x2="680" y2="14" stroke="#f0f0f0" stroke-width="1" />
  </g>

  <!-- 06 API LAYER -->
  <g transform="translate(135, 344)">
    <text x="0" y="0" class="mono stage-title">API LAYER</text>
    <text x="145" y="0" class="mono stage-sub">FASTAPI · gRPC INTERFACES · SECURE AUTH &amp; RATE LIMITING</text>
    <text x="680" y="0" class="mono stage-spec" text-anchor="end">ZERO-TRUST</text>
    <line x1="0" y1="14" x2="680" y2="14" stroke="#f0f0f0" stroke-width="1" />
  </g>

  <!-- 07 APPLICATION -->
  <g transform="translate(135, 396)">
    <text x="0" y="0" class="mono stage-title">APPLICATION</text>
    <text x="145" y="0" class="mono stage-sub">ENTERPRISE CLIENTS · REAL-TIME STREAMING · METRIC TELEMETRY</text>
    <text x="680" y="0" class="mono stage-spec" text-anchor="end">DEPLOYED: ACTIVE</text>
  </g>
</svg>
