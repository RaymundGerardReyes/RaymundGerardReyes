<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 340" width="100%" height="100%">
  <defs>
    <style>
      .mono { font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
      
      .tag   { font-size: 10px; fill: #ffffff; letter-spacing: 2px; }
      .meta  { font-size: 9px; fill: #ffffff; opacity: 0.45; letter-spacing: 1.5px; }
      .num   { font-size: 11px; fill: #ffffff; opacity: 0.35; font-weight: 600; }
      .title { font-size: 14.5px; font-weight: 700; fill: #ffffff; letter-spacing: 0.8px; }
      .spec  { font-size: 10px; fill: #ffffff; opacity: 0.45; letter-spacing: 1.2px; }
    </style>
  </defs>

  <!-- Canvas: Pure 80% Black Canvas with Fine 1px Border Panel -->
  <rect width="920" height="340" fill="#000000" />
  <rect x="1" y="1" width="918" height="338" fill="#050505" stroke="#141414" stroke-width="1.2" rx="4" />

  <!-- Corner Precision Ticks -->
  <path d="M 12 24 L 24 24 M 24 12 L 24 24" stroke="#ffffff" stroke-width="1" opacity="0.3" />
  <path d="M 908 24 L 896 24 M 896 12 L 896 24" stroke="#ffffff" stroke-width="1" opacity="0.3" />
  <path d="M 12 316 L 24 316 M 24 328 L 24 316" stroke="#ffffff" stroke-width="1" opacity="0.3" />
  <path d="M 908 316 L 896 316 M 896 328 L 896 316" stroke="#ffffff" stroke-width="1" opacity="0.3" />

  <!-- Section Header -->
  <g transform="translate(48, 38)">
    <text x="0" y="0" class="mono tag">01 // ENGINEERING FOCUS MANIFESTO</text>
    <text x="824" y="0" class="mono meta" text-anchor="end">SYSTEM CAPABILITY TIERS · CORE SPECIALIZATION</text>
    <line x1="0" y1="14" x2="824" y2="14" stroke="#1a1a1a" stroke-width="1" />
  </g>

  <!-- Left Environmental Computational Bus Line -->
  <line x1="48" y1="84" x2="48" y2="296" stroke="#1c1c1c" stroke-width="1.5" />

  <!-- Station Nodes on Left Track -->
  <circle cx="48" cy="84" r="2.5" fill="#ffffff" opacity="0.35" />
  <circle cx="48" cy="126" r="2.5" fill="#ffffff" opacity="0.35" />
  <circle cx="48" cy="168" r="2.5" fill="#ffffff" opacity="0.35" />
  <circle cx="48" cy="210" r="2.5" fill="#ffffff" opacity="0.35" />
  <circle cx="48" cy="252" r="2.5" fill="#ffffff" opacity="0.35" />
  <circle cx="48" cy="294" r="2.5" fill="#ffffff" opacity="0.35" />

  <!-- Perimeter Signal Traveling Along Left Rail -->
  <g>
    <circle cx="48" cy="84" r="3" fill="#ffffff">
      <animate attributeName="cy"
               values="84; 84; 126; 126; 168; 168; 210; 210; 252; 252; 294; 294; 84"
               keyTimes="0; 0.12; 0.18; 0.30; 0.36; 0.48; 0.54; 0.66; 0.72; 0.84; 0.90; 0.96; 1"
               dur="14s" repeatCount="indefinite" calcMode="linear" />
    </circle>
    <circle cx="48" cy="84" r="6" fill="none" stroke="#ffffff" stroke-width="0.8" opacity="0.3">
      <animate attributeName="cy"
               values="84; 84; 126; 126; 168; 168; 210; 210; 252; 252; 294; 294; 84"
               keyTimes="0; 0.12; 0.18; 0.30; 0.36; 0.48; 0.54; 0.66; 0.72; 0.84; 0.90; 0.96; 1"
               dur="14s" repeatCount="indefinite" calcMode="linear" />
      <animate attributeName="r" values="5; 8; 5" dur="2s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- 01 Item -->
  <g transform="translate(74, 88)">
    <text x="0" y="0" class="mono num">[01]</text>
    <text x="36" y="0" class="sans title">AI-POWERED SYSTEMS</text>
    <text x="798" y="0" class="mono spec" text-anchor="end">VISION · DEEP LEARNING · AGENTIC RUNTIMES</text>
    <line x1="0" y1="18" x2="798" y2="18" stroke="#141414" stroke-width="1" />
  </g>

  <!-- 02 Item -->
  <g transform="translate(74, 130)">
    <text x="0" y="0" class="mono num">[02]</text>
    <text x="36" y="0" class="sans title">SECURE BACKEND ARCHITECTURES</text>
    <text x="798" y="0" class="mono spec" text-anchor="end">ZERO-TRUST · DISTRIBUTED SERVICES · TRANSACTIONAL RLS</text>
    <line x1="0" y1="18" x2="798" y2="18" stroke="#141414" stroke-width="1" />
  </g>

  <!-- 03 Item -->
  <g transform="translate(74, 172)">
    <text x="0" y="0" class="mono num">[03]</text>
    <text x="36" y="0" class="sans title">FULL-STACK ENTERPRISE APPLICATIONS</text>
    <text x="798" y="0" class="mono spec" text-anchor="end">REACT · NEXT.JS · TYPESCRIPT · MODULAR MONOLITHS</text>
    <line x1="0" y1="18" x2="798" y2="18" stroke="#141414" stroke-width="1" />
  </g>

  <!-- 04 Item -->
  <g transform="translate(74, 214)">
    <text x="0" y="0" class="mono num">[04]</text>
    <text x="36" y="0" class="sans title">DEVELOPER AUTOMATION &amp; TOOLING</text>
    <text x="798" y="0" class="mono spec" text-anchor="end">WORKFLOW ENGINES · CI/CD PIPELINES · CODE GENERATION</text>
    <line x1="0" y1="18" x2="798" y2="18" stroke="#141414" stroke-width="1" />
  </g>

  <!-- 05 Item -->
  <g transform="translate(74, 256)">
    <text x="0" y="0" class="mono num">[05]</text>
    <text x="36" y="0" class="sans title">MACHINE LEARNING WORKFLOWS</text>
    <text x="798" y="0" class="mono spec" text-anchor="end">DATASET CURATION · EVALUATION SUITES · INFERENCE SERVING</text>
    <line x1="0" y1="18" x2="798" y2="18" stroke="#141414" stroke-width="1" />
  </g>

  <!-- 06 Item -->
  <g transform="translate(74, 298)">
    <text x="0" y="0" class="mono num">[06]</text>
    <text x="36" y="0" class="sans title">SECURITY-AWARE APPLICATION DESIGN</text>
    <text x="798" y="0" class="mono spec" text-anchor="end">WEBAUTHN · AUDIT TRAILS · COMPLIANCE ENFORCEMENT</text>
  </g>
</svg>
