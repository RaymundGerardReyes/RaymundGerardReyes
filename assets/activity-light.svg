<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 280" width="100%" height="100%">
  <defs>
    <style>
      .mono { font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
      
      .tag     { font-size: 10px; fill: #111111; letter-spacing: 2px; }
      .meta    { font-size: 9px; fill: #777777; letter-spacing: 1.5px; }
      .col-tag { font-size: 10px; font-weight: 700; fill: #111111; letter-spacing: 1.5px; }
      .stat-lbl{ font-size: 9.5px; fill: #666666; letter-spacing: 1px; }
      .stat-val{ font-size: 10px; font-weight: 600; fill: #000000; letter-spacing: 1px; }
      .bar-lbl { font-size: 9px; fill: #333333; letter-spacing: 1px; }
      .bar-pct { font-size: 9px; fill: #777777; letter-spacing: 0.5px; }
    </style>
  </defs>

  <!-- Canvas: Pure White Light Mode Surface with Subtle Border -->
  <rect width="920" height="280" fill="#ffffff" />
  <rect x="1" y="1" width="918" height="278" fill="#fafafa" stroke="#e5e5e5" stroke-width="1.2" rx="4" />

  <!-- Corner Precision Ticks -->
  <path d="M 12 24 L 24 24 M 24 12 L 24 24" stroke="#000000" stroke-width="1" opacity="0.3" />
  <path d="M 908 24 L 896 24 M 896 12 L 896 24" stroke="#000000" stroke-width="1" opacity="0.3" />
  <path d="M 12 256 L 24 256 M 24 268 L 24 256" stroke="#000000" stroke-width="1" opacity="0.3" />
  <path d="M 908 256 L 896 256 M 896 268 L 896 256" stroke="#000000" stroke-width="1" opacity="0.3" />

  <!-- Section Header -->
  <g transform="translate(48, 38)">
    <text x="0" y="0" class="mono tag">03 // ENGINEERING ACTIVITY &amp; TELEMETRY</text>
    <text x="824" y="0" class="mono meta" text-anchor="end">CODE DISTRIBUTION &amp; SYSTEM METRICS</text>
    <line x1="0" y1="14" x2="824" y2="14" stroke="#e5e5e5" stroke-width="1" />
  </g>

  <!-- Midfield Divider Line -->
  <line x1="470" y1="70" x2="470" y2="248" stroke="#eeeeee" stroke-width="1" />

  <!-- ============================================================== -->
  <!-- LEFT COLUMN: ACTIVITY TRAJECTORY & METRIC GRAPH               -->
  <!-- ============================================================== -->

  <g transform="translate(48, 76)">
    <text x="0" y="0" class="mono col-tag">COMMIT TRAJECTORY &amp; CADENCE</text>
    
    <!-- Background Grid Lines -->
    <line x1="0" y1="40" x2="380" y2="40" stroke="#f0f0f0" stroke-width="1" stroke-dasharray="2 4" />
    <line x1="0" y1="80" x2="380" y2="80" stroke="#f0f0f0" stroke-width="1" stroke-dasharray="2 4" />
    <line x1="0" y1="120" x2="380" y2="120" stroke="#f0f0f0" stroke-width="1" />

    <!-- Self-Drawing Activity Vector Curve -->
    <path d="M 0 115 L 45 110 L 90 95 L 135 105 L 180 75 L 225 85 L 270 50 L 315 65 L 360 30 L 380 40"
          fill="none" stroke="#000000" stroke-width="1.8"
          stroke-dasharray="500" stroke-dashoffset="500">
      <animate attributeName="stroke-dashoffset" values="500; 0" dur="3s" fill="freeze" calcMode="spline" keySplines="0.4 0 0.2 1" />
    </path>

    <!-- Head Pulse Point on Trajectory Curve -->
    <circle cx="380" cy="40" r="3" fill="#000000">
      <animate attributeName="opacity" values="0; 1; 0.4; 1" keyTimes="0; 0.7; 0.85; 1" dur="4s" repeatCount="indefinite" />
    </circle>

    <!-- Key Metrics Telemetry -->
    <g transform="translate(0, 148)">
      <text x="0" y="0" class="mono stat-lbl">CADENCE:</text>
      <text x="65" y="0" class="mono stat-val">ACTIVE</text>
      
      <text x="140" y="0" class="mono stat-lbl">INTEGRITY:</text>
      <text x="215" y="0" class="mono stat-val">VERIFIED</text>

      <text x="290" y="0" class="mono stat-lbl">REPOS:</text>
      <text x="340" y="0" class="mono stat-val">INDEXED</text>
    </g>
  </g>

  <!-- ============================================================== -->
  <!-- RIGHT COLUMN: CORE RUNTIME DISTRIBUTION BARS                   -->
  <!-- ============================================================== -->

  <g transform="translate(500, 76)">
    <text x="0" y="0" class="mono col-tag">CORE ARCHITECTURAL RUNTIMES</text>

    <!-- Bar 01: C# / .NET -->
    <g transform="translate(0, 26)">
      <text x="0" y="0" class="mono bar-lbl">C# / .NET ARCHITECTURE</text>
      <text x="372" y="0" class="mono bar-pct" text-anchor="end">32%</text>
      <rect x="0" y="6" width="372" height="4" fill="#eeeeee" rx="2" />
      <rect x="0" y="6" width="0" height="4" fill="#000000" rx="2">
        <animate attributeName="width" values="0; 120" dur="1.8s" fill="freeze" calcMode="spline" keySplines="0.4 0 0.2 1" />
      </rect>
    </g>

    <!-- Bar 02: PYTHON / ML -->
    <g transform="translate(0, 58)">
      <text x="0" y="0" class="mono bar-lbl">PYTHON / PYTORCH / ML</text>
      <text x="372" y="0" class="mono bar-pct" text-anchor="end">28%</text>
      <rect x="0" y="6" width="372" height="4" fill="#eeeeee" rx="2" />
      <rect x="0" y="6" width="0" height="4" fill="#000000" rx="2">
        <animate attributeName="width" values="0; 104" dur="2.0s" fill="freeze" calcMode="spline" keySplines="0.4 0 0.2 1" />
      </rect>
    </g>

    <!-- Bar 03: TYPESCRIPT / WEB -->
    <g transform="translate(0, 90)">
      <text x="0" y="0" class="mono bar-lbl">TYPESCRIPT / NEXT.JS / REACT</text>
      <text x="372" y="0" class="mono bar-pct" text-anchor="end">22%</text>
      <rect x="0" y="6" width="372" height="4" fill="#eeeeee" rx="2" />
      <rect x="0" y="6" width="0" height="4" fill="#000000" rx="2">
        <animate attributeName="width" values="0; 82" dur="2.2s" fill="freeze" calcMode="spline" keySplines="0.4 0 0.2 1" />
      </rect>
    </g>

    <!-- Bar 04: JAVA / SPRING -->
    <g transform="translate(0, 122)">
      <text x="0" y="0" class="mono bar-lbl">JAVA / SPRING BOOT</text>
      <text x="372" y="0" class="mono bar-pct" text-anchor="end">12%</text>
      <rect x="0" y="6" width="372" height="4" fill="#eeeeee" rx="2" />
      <rect x="0" y="6" width="0" height="4" fill="#000000" rx="2">
        <animate attributeName="width" values="0; 45" dur="2.4s" fill="freeze" calcMode="spline" keySplines="0.4 0 0.2 1" />
      </rect>
    </g>

    <!-- Bar 05: DATA & STORAGE -->
    <g transform="translate(0, 154)">
      <text x="0" y="0" class="mono bar-lbl">POSTGRESQL / SQL / STORAGE</text>
      <text x="372" y="0" class="mono bar-pct" text-anchor="end">6%</text>
      <rect x="0" y="6" width="372" height="4" fill="#eeeeee" rx="2" />
      <rect x="0" y="6" width="0" height="4" fill="#000000" rx="2">
        <animate attributeName="width" values="0; 24" dur="2.6s" fill="freeze" calcMode="spline" keySplines="0.4 0 0.2 1" />
      </rect>
    </g>
  </g>
</svg>
