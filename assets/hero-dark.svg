<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 280" width="100%" height="100%">
  <defs>
    <style>
      .mono { font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
      .label { font-size: 11px; fill: #777777; letter-spacing: 1.5px; }
      .title { font-size: 46px; font-weight: 800; fill: #ffffff; letter-spacing: 4px; }
      .role { font-size: 13.5px; font-weight: 600; fill: #dedede; letter-spacing: 2px; }
      .desc { font-size: 13.5px; fill: #999999; letter-spacing: 0.2px; }
      .caption { font-size: 10px; fill: #777777; letter-spacing: 1px; }
      .coord { font-size: 9px; fill: #555555; }
    </style>
    <!-- Technical Paper Dot Grid Pattern - Dark Variant -->
    <pattern id="dot-grid-dark" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="0.8" fill="#222222" />
    </pattern>
  </defs>

  <!-- Canvas Surface -->
  <rect width="920" height="280" fill="#0d1117" />
  <rect x="1" y="1" width="918" height="278" fill="#121212" rx="6" stroke="#262626" stroke-width="1.2" />

  <!-- Subtle Moving Coordinate Field -->
  <g opacity="0.75">
    <rect x="20" y="20" width="880" height="240" fill="url(#dot-grid-dark)" />
    <!-- Technical coordinate guides -->
    <line x1="20" y1="70" x2="900" y2="70" stroke="#1c1c1c" stroke-width="1" stroke-dasharray="2 4" />
    <line x1="20" y1="210" x2="900" y2="210" stroke="#1c1c1c" stroke-width="1" stroke-dasharray="2 4" />
    <line x1="60" y1="20" x2="60" y2="260" stroke="#1c1c1c" stroke-width="1" stroke-dasharray="2 4" />
    <line x1="860" y1="20" x2="860" y2="260" stroke="#1c1c1c" stroke-width="1" stroke-dasharray="2 4" />
    
    <!-- Calibration ticks -->
    <path d="M 55 70 L 65 70 M 60 65 L 60 75" stroke="#333333" stroke-width="1" />
    <path d="M 855 70 L 865 70 M 860 65 L 860 75" stroke="#333333" stroke-width="1" />
    <path d="M 55 210 L 65 210 M 60 205 L 60 215" stroke="#333333" stroke-width="1" />
    <path d="M 855 210 L 865 210 M 860 205 L 860 215" stroke="#333333" stroke-width="1" />
  </g>

  <!-- Top Technical Header Bar -->
  <text x="60" y="48" class="mono label">SYS.SPEC // 2026.01 · EDITORIAL TECHNICAL SYSTEM</text>
  <g transform="translate(730, 41)">
    <circle cx="0" cy="0" r="3" fill="#ffffff">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="4s" repeatCount="indefinite" />
    </circle>
    <text x="10" y="4" class="mono caption">STATE: ONLINE // 0x4F</text>
  </g>

  <!-- Primary Identity -->
  <text x="60" y="105" class="sans title">ARDS</text>
  <text x="60" y="132" class="mono role">AI ENGINEERING · SOFTWARE SYSTEMS · MACHINE LEARNING</text>
  <text x="60" y="156" class="sans desc">Building intelligent systems, robust backend architectures, and production-grade software.</text>

  <!-- Subtle Horizontal Precision Grid Line with Very Slow Drift -->
  <g opacity="0.35">
    <line x1="60" y1="180" x2="860" y2="180" stroke="#222222" stroke-width="1" />
    <line x1="200" y1="175" x2="200" y2="185" stroke="#555555" stroke-width="1">
      <animateTransform attributeName="transform" type="translate" values="0 0; 400 0; 0 0" dur="24s" repeatCount="indefinite" />
    </line>
  </g>

  <!-- Technical Computational Signal Rail -->
  <g transform="translate(0, 215)">
    <!-- Baseline track -->
    <line x1="60" y1="0" x2="860" y2="0" stroke="#2a2a2a" stroke-width="1.5" />
    
    <!-- Measurement Markers -->
    <line x1="60" y1="-5" x2="60" y2="5" stroke="#ffffff" stroke-width="1.5" />
    <line x1="260" y1="-3" x2="260" y2="3" stroke="#444444" stroke-width="1" />
    <line x1="460" y1="-3" x2="460" y2="3" stroke="#444444" stroke-width="1" />
    <line x1="660" y1="-3" x2="660" y2="3" stroke="#444444" stroke-width="1" />
    <line x1="860" y1="-5" x2="860" y2="5" stroke="#ffffff" stroke-width="1.5" />

    <text x="60" y="16" class="mono coord">00 // INGEST</text>
    <text x="260" y="16" class="mono coord" text-anchor="middle">25 // ARCH</text>
    <text x="460" y="16" class="mono coord" text-anchor="middle">50 // COMPUTE</text>
    <text x="660" y="16" class="mono coord" text-anchor="middle">75 // VERIFY</text>
    <text x="860" y="16" class="mono coord" text-anchor="end">100 // DEPLOY</text>

    <!-- Signal Dot Traveling Quietly Across the Bus -->
    <g>
      <!-- Outer subtle halo -->
      <circle cx="60" cy="0" r="7" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.2">
        <animate attributeName="cx" values="60; 860; 60" dur="11s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1; 0.4 0 0.2 1" />
        <animate attributeName="r" values="6; 9; 6" dur="2.75s" repeatCount="indefinite" />
      </circle>
      <!-- Solid core signal -->
      <circle cx="60" cy="0" r="3.5" fill="#ffffff">
        <animate attributeName="cx" values="60; 860; 60" dur="11s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1; 0.4 0 0.2 1" />
      </circle>
    </g>
  </g>
</svg>
