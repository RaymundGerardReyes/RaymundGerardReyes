<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 280" width="100%" height="100%">
  <defs>
    <style>
      .mono { font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
      
      .tag     { font-size: 10px; fill: #ffffff; letter-spacing: 2px; }
      .meta    { font-size: 9px; fill: #ffffff; opacity: 0.45; letter-spacing: 1.5px; }
      .col-tag { font-size: 10px; font-weight: 700; fill: #ffffff; opacity: 0.85; letter-spacing: 1.5px; }
      .stat-lbl{ font-size: 9.5px; fill: #ffffff; opacity: 0.55; letter-spacing: 1px; }
      .stat-val{ font-size: 10px; font-weight: 600; fill: #ffffff; letter-spacing: 1px; }
      .bar-lbl { font-size: 9px; fill: #ffffff; opacity: 0.7; letter-spacing: 1px; }
      .bar-pct { font-size: 9px; fill: #ffffff; opacity: 0.45; letter-spacing: 0.5px; }
    </style>
  </defs>

  <!-- Canvas: Pure 80% Black Canvas with Fine 1px Border Panel -->
  <rect width="920" height="280" fill="#000000" />
  <rect x="1" y="1" width="918" height="278" fill="#050505" stroke="#141414" stroke-width="1.2" rx="4" />

  <!-- Corner Precision Ticks -->
  <path d="M 12 24 L 24 24 M 24 12 L 24 24" stroke="#ffffff" stroke-width="1" opacity="0.3" />
  <path d="M 908 24 L 896 24 M 896 12 L 896 24" stroke="#ffffff" stroke-width="1" opacity="0.3" />
  <path d="M 12 256 L 24 256 M 24 268 L 24 256" stroke="#ffffff" stroke-width="1" opacity="0.3" />
  <path d="M 908 256 L 896 256 M 896 268 L 896 256" stroke="#ffffff" stroke-width="1" opacity="0.3" />

  <!-- Section Header -->
  <g transform="translate(48, 38)">
    <text x="0" y="0" class="mono tag">03 // ENGINEERING ACTIVITY &amp; TELEMETRY</text>
    <text x="824" y="0" class="mono meta" text-anchor="end">CODE DISTRIBUTION &amp; SYSTEM METRICS</text>
    <line x1="0" y1="14" x2="824" y2="14" stroke="#1a1a1a" stroke-width="1" />
  </g>

  <!-- Midfield Divider Line -->
  <line x1="470" y1="70" x2="470" y2="248" stroke="#141414" stroke-width="1" />

  <!-- ============================================================== -->
  <!-- LEFT COLUMN: CONTINUOUS TELEMETRY TRAJECTORY & METRIC GRAPH    -->
  <!-- ============================================================== -->

  <g transform="translate(48, 76)">
    <text x="0" y="0" class="mono col-tag">COMMIT TRAJECTORY &amp; CADENCE</text>
    
    <!-- Background Grid Lines -->
    <line x1="0" y1="40" x2="380" y2="40" stroke="#141414" stroke-width="1" stroke-dasharray="2 4" />
    <line x1="0" y1="80" x2="380" y2="80" stroke="#141414" stroke-width="1" stroke-dasharray="2 4" />
    <line x1="0" y1="120" x2="380" y2="120" stroke="#181818" stroke-width="1" />

    <!-- Vertical Drop Lines (Subtle Cadence Stems) -->
    <line x1="45" y1="110" x2="45" y2="120" stroke="#1c1c1c" stroke-width="1" />
    <line x1="90" y1="95" x2="90" y2="120" stroke="#1c1c1c" stroke-width="1" />
    <line x1="135" y1="105" x2="135" y2="120" stroke="#1c1c1c" stroke-width="1" />
    <line x1="180" y1="75" x2="180" y2="120" stroke="#1c1c1c" stroke-width="1" />
    <line x1="225" y1="85" x2="225" y2="120" stroke="#1c1c1c" stroke-width="1" />
    <line x1="270" y1="50" x2="270" y2="120" stroke="#1c1c1c" stroke-width="1" />
    <line x1="315" y1="65" x2="315" y2="120" stroke="#1c1c1c" stroke-width="1" />
    <line x1="360" y1="30" x2="360" y2="120" stroke="#1c1c1c" stroke-width="1" />
    <line x1="380" y1="40" x2="380" y2="120" stroke="#1c1c1c" stroke-width="1" />

    <!-- Persistent Baseline Vector Curve (Always Fully Drawn & Visible) -->
    <path d="M 0 115 L 45 110 L 90 95 L 135 105 L 180 75 L 225 85 L 270 50 L 315 65 L 360 30 L 380 40"
          fill="none" stroke="#ffffff" stroke-width="1.8" />

    <!-- Milestone Station Points along the Trajectory -->
    <circle cx="45" cy="110" r="2.5" fill="#ffffff" opacity="0.6" />
    <circle cx="90" cy="95" r="2.5" fill="#ffffff" opacity="0.6" />
    <circle cx="135" cy="105" r="2.5" fill="#ffffff" opacity="0.6" />
    <circle cx="180" cy="75" r="2.5" fill="#ffffff" opacity="0.6" />
    <circle cx="225" cy="85" r="2.5" fill="#ffffff" opacity="0.6" />
    <circle cx="270" cy="50" r="2.5" fill="#ffffff" opacity="0.6" />
    <circle cx="315" cy="65" r="2.5" fill="#ffffff" opacity="0.6" />
    <circle cx="360" cy="30" r="2.5" fill="#ffffff" opacity="0.6" />
    <circle cx="380" cy="40" r="3.5" fill="#ffffff" />

    <!-- Sweeping Radar Scan Line Traversing Horizontally -->
    <line x1="0" y1="20" x2="0" y2="120" stroke="#ffffff" stroke-width="1" opacity="0.25" stroke-dasharray="2 2">
      <animateTransform attributeName="transform" type="translate" values="0 0; 380 0; 0 0" dur="8s" repeatCount="indefinite" />
    </line>

    <!-- Continuous Traveling Telemetry Signal Packet -->
    <circle r="3.5" fill="#ffffff">
      <animateMotion path="M 0 115 L 45 110 L 90 95 L 135 105 L 180 75 L 225 85 L 270 50 L 315 65 L 360 30 L 380 40"
                     dur="5s" repeatCount="indefinite" calcMode="linear" />
    </circle>
    
    <!-- Expanding Halo Pulse at Traveling Packet -->
    <circle r="7" fill="none" stroke="#ffffff" stroke-width="0.9" opacity="0.3">
      <animateMotion path="M 0 115 L 45 110 L 90 95 L 135 105 L 180 75 L 225 85 L 270 50 L 315 65 L 360 30 L 380 40"
                     dur="5s" repeatCount="indefinite" calcMode="linear" />
      <animate attributeName="r" values="4; 9; 4" dur="1.66s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.4; 0.1; 0.4" dur="1.66s" repeatCount="indefinite" />
    </circle>

    <!-- Key Metrics Telemetry -->
    <g transform="translate(0, 148)">
      <text x="0" y="0" class="mono stat-lbl">CADENCE:</text>
      <text x="65" y="0" class="mono stat-val">CONTINUOUS</text>
      
      <text x="160" y="0" class="mono stat-lbl">INTEGRITY:</text>
      <text x="235" y="0" class="mono stat-val">VERIFIED</text>

      <text x="310" y="0" class="mono stat-lbl">STATE:</text>
      <text x="355" y="0" class="mono stat-val">ACTIVE</text>
    </g>
  </g>

  <!-- ============================================================== -->
  <!-- RIGHT COLUMN: CORE RUNTIME DISTRIBUTION BARS (ACTIVE TELEMETRY) -->
  <!-- ============================================================== -->

  <g transform="translate(500, 76)">
    <text x="0" y="0" class="mono col-tag">CORE ARCHITECTURAL RUNTIMES</text>

    <!-- Bar 01: C# / .NET -->
    <g transform="translate(0, 26)">
      <text x="0" y="0" class="mono bar-lbl">C# / .NET ARCHITECTURE</text>
      <text x="372" y="0" class="mono bar-pct" text-anchor="end">32%</text>
      <rect x="0" y="6" width="372" height="4" fill="#141414" rx="2" />
      <!-- Solid Visible Base Bar -->
      <rect x="0" y="6" width="120" height="4" fill="#ffffff" rx="2" opacity="0.9" />
      <!-- Continuous Signal Tick Moving along Bar -->
      <circle cx="0" cy="8" r="2.5" fill="#ffffff">
        <animate attributeName="cx" values="0; 120; 0" dur="4s" repeatCount="indefinite" calcMode="linear" />
      </circle>
    </g>

    <!-- Bar 02: PYTHON / ML -->
    <g transform="translate(0, 58)">
      <text x="0" y="0" class="mono bar-lbl">PYTHON / PYTORCH / ML</text>
      <text x="372" y="0" class="mono bar-pct" text-anchor="end">28%</text>
      <rect x="0" y="6" width="372" height="4" fill="#141414" rx="2" />
      <rect x="0" y="6" width="104" height="4" fill="#ffffff" rx="2" opacity="0.9" />
      <circle cx="0" cy="8" r="2.5" fill="#ffffff">
        <animate attributeName="cx" values="0; 104; 0" dur="4.4s" repeatCount="indefinite" calcMode="linear" />
      </circle>
    </g>

    <!-- Bar 03: TYPESCRIPT / WEB -->
    <g transform="translate(0, 90)">
      <text x="0" y="0" class="mono bar-lbl">TYPESCRIPT / NEXT.JS / REACT</text>
      <text x="372" y="0" class="mono bar-pct" text-anchor="end">22%</text>
      <rect x="0" y="6" width="372" height="4" fill="#141414" rx="2" />
      <rect x="0" y="6" width="82" height="4" fill="#ffffff" rx="2" opacity="0.9" />
      <circle cx="0" cy="8" r="2.5" fill="#ffffff">
        <animate attributeName="cx" values="0; 82; 0" dur="4.8s" repeatCount="indefinite" calcMode="linear" />
      </circle>
    </g>

    <!-- Bar 04: JAVA / SPRING -->
    <g transform="translate(0, 122)">
      <text x="0" y="0" class="mono bar-lbl">JAVA / SPRING BOOT</text>
      <text x="372" y="0" class="mono bar-pct" text-anchor="end">12%</text>
      <rect x="0" y="6" width="372" height="4" fill="#141414" rx="2" />
      <rect x="0" y="6" width="45" height="4" fill="#ffffff" rx="2" opacity="0.9" />
      <circle cx="0" cy="8" r="2.5" fill="#ffffff">
        <animate attributeName="cx" values="0; 45; 0" dur="5.2s" repeatCount="indefinite" calcMode="linear" />
      </circle>
    </g>

    <!-- Bar 05: DATA & STORAGE -->
    <g transform="translate(0, 154)">
      <text x="0" y="0" class="mono bar-lbl">POSTGRESQL / SQL / STORAGE</text>
      <text x="372" y="0" class="mono bar-pct" text-anchor="end">6%</text>
      <rect x="0" y="6" width="372" height="4" fill="#141414" rx="2" />
      <rect x="0" y="6" width="24" height="4" fill="#ffffff" rx="2" opacity="0.9" />
      <circle cx="0" cy="8" r="2.5" fill="#ffffff">
        <animate attributeName="cx" values="0; 24; 0" dur="5.6s" repeatCount="indefinite" calcMode="linear" />
      </circle>
    </g>
  </g>
</svg>
